<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your order · Olaoyin Store</title><style>
*{box-sizing:border-box}body{font:16px system-ui,sans-serif;background:#faf8f0;color:#243d2e;max-width:650px;margin:0 auto;padding:24px 16px}a{color:#285a3d}h1{font-family:Georgia,serif;margin:16px 0}section{background:white;border:1px solid #e0e3d7;padding:24px;border-radius:16px;margin-bottom:16px}p{line-height:1.6;margin:6px 0}
.headline{font-size:18px;font-weight:700;margin:0 0 18px}.cancelled{background:#fbeaea;color:#8a2a2a;padding:12px;border-radius:10px}
.steps{display:flex;list-style:none;padding:0;margin:0 0 8px;gap:4px}.steps li{flex:1;text-align:center;font-size:12px;color:#8a9585;padding-top:28px;position:relative}.steps li::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:20px;height:20px;border-radius:50%;background:#e3e7dc;border:2px solid #d0d7c8}.steps li.done{color:#285a3d;font-weight:600}.steps li.done::before{background:#285a3d;border-color:#285a3d}
dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0}dt{color:#637060;font-size:14px}dd{margin:0;overflow-wrap:anywhere}
button,.btn{font:inherit;display:inline-block;padding:12px 16px;border:0;border-radius:8px;background:#285a3d;color:white;cursor:pointer;margin:8px 8px 0 0;text-decoration:none}button.secondary{background:#eaf0e3;color:#254d33}button:disabled{opacity:.5}
.link{display:flex;gap:8px;margin-top:8px}.link input{flex:1;min-width:0;font:inherit;font-size:13px;padding:10px;border:1px solid #d4dccd;border-radius:8px;background:#fafaf6}.link button{margin:0}
.note{font-size:13px;color:#637060}button:focus-visible,a:focus-visible{outline:3px solid #b98c30;outline-offset:3px}
</style><a href="/">← Olaoyin Store</a><h1>Your order</h1>
<section><p class="headline" id="headline" role="status">Loading…</p><ol class="steps" id="steps" aria-label="Order progress"></ol></section>
<section><dl id="details"></dl>
<button id="pay" hidden>Pay online</button><button id="verify" class="secondary" hidden>Check payment</button><button id="refresh" class="secondary">Refresh status</button>
<p id="message" role="status"></p><a id="whatsapp" class="btn" hidden target="_blank" rel="noopener">Chat with us on WhatsApp</a></section>
<section><strong>Save your order link</strong><p class="note">Use this private link to check progress and pay. Anyone with the link can view this order, so share it only with the store.</p><div class="link"><input id="link" readonly aria-label="Your private order link"><button id="copy">Copy link</button></div></section>
<script src="shared.js"></script><script src="order.js"></script></html>
